# All variables are lower-case to avoid system env conflicts
# Logging
log_level=info          # debug, info, warn, error (case-insensitive)
log_retention_days=7    # delete logs older than this
log_dir=/var/log/automount

# Mount behavior
mount_health_interval=30   # seconds between health checks
default_retry_max=3
default_retry_sleep=2
